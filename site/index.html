  <meta property="og:description" content="Eight years of hiking, riding, running and paddling, mapped. Trail, dirt, saltwater.">

  <meta property="og:url" content="https://neelgengje.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="landing">

  <!-- Nav -->
  <nav class="top-nav">
    <a class="nav-brand" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M8 16 L12 7 L16 16 L12 13 Z" fill="currentColor" stroke="none"/>
      </svg>
      TRAIL LOG
    </a>
    <div class="nav-spacer"></div>
    <div class="nav-links">
      <a href="/" class="nav-link active">home</a>
      <a href="/app.html" class="nav-link">map</a>
    </div>
  </nav>

  <main class="hero">

    <!-- Background illustration -->
    <div class="hf">
      <picture>
        <source media="(max-aspect-ratio: 1/1)" srcset="/img/trail-portrait.jpg">
        <img src="/img/trail.jpg" alt="A trail runner on a dirt singletrack above an alpine lake at dusk" class="hero-art" fetchpriority="high" decoding="async">
      </picture>
    </div>
    <div class="scrim"></div>

    <!-- Pinned print -->
    <figure class="print">
      <img src="/img/print.jpg" alt="Overlooking the ocean from a cliff">
      <figcaption><span>Crouching Lion</span><span>O'ahu</span></figcaption>
    </figure>

    <!-- Copy -->
    <div class="wrap">
      <p class="meta"><span>last entry <i id="last-entry">—</i></span></p>
      <h1 class="hero-headline">Trail, dirt,<br>saltwater<span class="cursor"></span></h1>
      <p class="hero-sub">I have been recording every hike, ride, run and paddle since 2018. None of it was for anyone else, but the map turned out to be worth looking at.</p>
      <a href="/app.html" class="btn-cta">
        See where I've been
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13M13 6l6 6-6 6"/>
        </svg>
      </a>
    </div>

    <!-- Figures -->
    <div class="base">
      <div><span class="lab">days out</span><span class="num" id="stat-count">—</span></div>
      <div><span class="lab">miles</span><span class="num" id="stat-miles">—</span></div>
      <div><span class="lab">ft climbed</span><span class="num" id="stat-elev">—</span></div>
      <div><span class="lab">hours</span><span class="num" id="stat-hours">—</span></div>
      <div><span class="lab">sports</span><span class="num" id="stat-sports">—</span></div>
    </div>

  </main>

  <script src="/js/config.js"></script>
  <script src="/js/landing.js"></script>
  <script src="/js/track.js"></script>
</body>
</html>
