<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trail Atlas</title>
  <meta name="description" content="8 years of hiking, riding, and running — 2,806 miles across California and beyond, beautifully mapped.">
  <meta property="og:title" content="Trail Atlas">
  <meta property="og:description" content="8 years of hiking, riding, and running — 2,806 miles across California and beyond, beautifully mapped.">
  <meta property="og:image" content="https://neelgengje.com/og-image.png">
  <meta property="og:url" content="https://neelgengje.com">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Source+Serif+Pro:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="/css/shared.css" />
  <link rel="stylesheet" href="/css/landing.css" />
</head>
<body>

  <!-- Nav -->
  <nav class="top-nav">
    <a class="nav-brand" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20L10 6L14 14L18 10L21 20H3Z"/></svg>
      Trail Atlas
    </a>
    <div class="nav-spacer"></div>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <canvas class="hero-canvas" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <div class="hero-content">
      <h1><span class="w">Every</span> <span class="w">trail</span> <span class="w">tells</span> <span class="w">a</span> <span class="w pop">story.</span></h1>
      <p class="hero-sub" id="hero-sub">Your outdoor adventures, beautifully mapped.</p>
      <div class="hero-pills" id="hero-pills" style="display:none"></div>
      <div class="hero-cta-wrap" id="hero-cta"></div>
    </div>
  </section>

  <!-- Stats Ribbon -->
  <section class="stats-section" id="stats-section" style="display:none">
    <div class="stats-title">By the numbers</div>
    <div class="stats-float">
      <div class="fc" style="transition-delay:0s">
        <div class="fi"><i class="ph-duotone ph-path"></i></div>
        <div class="fv" id="rs-total" data-target="0">0</div>
        <div class="fl">Activities</div>
      </div>
      <div class="fc" style="transition-delay:0.1s">
        <div class="fi"><i class="ph-duotone ph-map-trifold"></i></div>
        <div class="fv" id="rs-miles" data-target="0">0</div>
        <div class="fl">Miles</div>
      </div>
      <div class="fc" style="transition-delay:0.15s">
        <div class="fi"><i class="ph-duotone ph-trend-up"></i></div>
        <div class="fv" id="rs-elev" data-target="0" data-suffix="K">0</div>
        <div class="fl">Ft Gained</div>
      </div>
      <div class="fc" style="transition-delay:0.2s">
        <div class="fi"><i class="ph-duotone ph-calendar-dots"></i></div>
        <div class="fv" id="rs-years" data-target="0">0</div>
        <div class="fl">Years Active</div>
      </div>
    </div>
  </section>

  <!-- Activity Cards -->
  <section class="cards-section" id="cards-section" style="display:none">
    <div class="cards-header">
      <h2>Your Adventures</h2>
      <p>Tap to explore on the map</p>
    </div>
    <div class="cg" id="cards-grid"></div>
  </section>

  <!-- Footer -->
  <footer class="landing-footer">Built with Strava data</footer>

  <script src="/js/hero-bg.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/landing.js"></script>
</body>
</html>
