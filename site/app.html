<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GTYKHLJXDT"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GTYKHLJXDT');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trail Atlas</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/shared.css" />
  <link rel="stylesheet" href="/css/dashboard-core.css" />
  <link rel="stylesheet" href="/css/dashboard-layout.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <!-- Starts this fetch immediately instead of waiting for all 10 dashboard
       scripts to download and run first (loadTrailData() isn't called
       until initV2App() at the bottom runs) — same download, just
       overlapped with script fetch/parse instead of queued after it. -->
  <link rel="preload" as="fetch" href="/data/activities.json" crossorigin>
</head>
<body class="proto-v2">

  <div id="map"></div>

  <!-- Title island, width-matched to the drawer below it. -->
  <header class="brand-island glass">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20L10 6L14 14L18 10L21 20H3Z"/></svg>
      Trail Log
    </a>
  </header>

  <!-- Stats header, then filters, then the activity list. -->
  <aside id="drawer" class="drawer glass">
    <div class="drawer-stats">
      <div class="dstat2"><span class="figure" id="stat-count">&mdash;</span><span class="label">activities</span></div>
      <div class="dstat2"><span class="figure" id="stat-miles">&mdash;</span><span class="label">miles</span></div>
      <div class="dstat2"><span class="figure" id="stat-elev">&mdash;</span><span class="label">ft gain</span></div>
    </div>
    <div class="drawer-search">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="6"/><path d="M17 17l-3.5-3.5"/></svg>
      <input id="activity-search" type="text" placeholder="Search activities" autocomplete="off" />
    </div>
    <div class="drawer-filters">
      <div id="sport-select"></div>
      <div id="year-select"></div>
      <button id="clear-filters-btn" class="clear-filters-btn" type="button">Clear filters</button>
    </div>
    <ul id="activity-list" class="activity-list scroll-thin"></ul>
  </aside>
  <button id="drawer-toggle" class="drawer-toggle glass" aria-label="Toggle activity list">
    <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="12 5 7 10 12 15"/>
    </svg>
  </button>
  <!-- Phone-width only (see app.css) — the drawer is full-screen there, so
       switching to the map is an explicit action instead of a partial
       collapse. Label/icon flip between "Map" and "List" in app-controller.js. -->
  <button id="mobile-view-toggle" class="mobile-view-toggle glass" type="button" aria-pressed="false">
    <svg class="miv-icon-map" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 3.5 2.5 5v11.5L7 15m0-11.5 6 2m-6-2v11.5m6-9.5 4.5-1.5V15L13 16.5m0-11.5-6 2m6 9.5V6.5"/>
    </svg>
    <svg class="miv-icon-list" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="6" x2="16" y2="6"/><line x1="4" y1="10" x2="16" y2="10"/><line x1="4" y1="14" x2="16" y2="14"/>
    </svg>
    <span class="miv-label">Map</span>
  </button>

  <div id="hover-label" class="hover-label glass"></div>

  <!-- Opens inline under the selected row in the drawer (see app.css). -->
  <div id="detail-panel" class="detail-panel glass">
    <div class="detail-top">
      <div class="detail-id">
        <div class="detail-title" id="detail-title"></div>
        <div class="detail-date" id="detail-date"></div>
      </div>
      <div class="detail-actions">
        <button id="replay-btn" class="replay-btn" type="button">
          <svg viewBox="0 0 20 20" width="11" height="11" fill="currentColor"><path d="M6 4L16 10L6 16Z"/></svg>
          Replay
        </button>
        <button id="detail-close" class="detail-close" type="button" aria-label="Close">&#10005;</button>
      </div>
    </div>
    <div class="detail-stats" id="detail-stats"></div>
    <!-- Populated only when the activity has HR/calorie data — see secondaryStatBlock() in app-controller.js. -->
    <div class="detail-stats-secondary" id="detail-stats-secondary"></div>
    <!-- Hidden unless the activity has an HR stream; both the label and the
         switch live in one control so they read as a single toggle. -->
    <button id="hr-toggle" class="hr-toggle-row" type="button" role="switch" aria-checked="false" aria-label="Show heart rate on chart">
      <span class="hr-toggle-label">HR</span>
      <span class="hr-switch"><span class="hr-switch-knob"></span></span>
    </button>
    <div class="detail-chart-wrap"><canvas id="detail-chart"></canvas></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/dashboard/engine.js"></script>
  <script src="/js/dashboard/data.js"></script>
  <script src="/js/dashboard/profile.js"></script>
  <script src="/js/dashboard/icons.js"></script>
  <script src="/js/dashboard/pins.js"></script>
  <script src="/js/dashboard/shell.js"></script>
  <script src="/js/dashboard/year-select.js"></script>
  <script src="/js/dashboard/sport-select.js"></script>
  <script src="/js/dashboard/app-controller.js"></script>
  <script>initV2App({ tileTheme: 'light', controlsPosition: 'bottomleft', inlineDetail: true });</script>
</body>
</html>
